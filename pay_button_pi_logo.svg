<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="512" height="512">
  <title>Pay Pi Logo</title>
  <defs>
    <!-- Pay button gradient: #A47CF3 to #F7C548 -->
    <linearGradient id="payButtonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A47CF3" />
      <stop offset="100%" stop-color="#F7C548" />
    </linearGradient>
  </defs>

  <!-- Circular background matching the home screen Pay button -->
  <circle cx="64" cy="64" r="64" fill="url(#payButtonGrad)" />

  <!-- Pi symbol matching the exact font and style from BottomNav -->
  <text 
    x="64" 
    y="66" 
    text-anchor="middle" 
    dominant-baseline="central" 
    fill="#FFFFFF" 
    font-size="72" 
    font-weight="bold" 
    font-family="Georgia, 'Times New Roman', serif"
  >π</text>
</svg>
